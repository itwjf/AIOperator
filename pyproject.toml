[project]
name = "aioperator"
version = "0.1.0"
description = "从零复刻的 LangChain Agent 学习项目"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.6.0",
    "loguru>=0.7.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "sse-starlette>=2.0.0",
    "pymilvus>=2.4.0",
    "python-multipart>=0.0.9",
    "fastmcp>=3.0.0",
    "langchain-mcp-adapters>=0.2.0",
    "pymysql>=1.1.0",
    "python-pptx>=1.0.0",
    "docker>=7.0.0",
    "tavily-python>=0.5.0",
    "duckduckgo-search>=6.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
